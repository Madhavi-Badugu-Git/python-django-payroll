<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Portal</title>
    <style>
        /* === 1. RESET & BACKGROUND === */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; /* Stops the page from scrolling */
        }

        /* === 2. MAIN CARD === */
        .login-card {
            display: flex;
            width: 100%;
            max-width: 950px;
            /* Adjusts height based on screen, ensuring it never overflows */
            height: 550px;
            max-height: 90vh; 
            
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 
                        0 1px 3px rgba(0,0,0,0.05);
            overflow: hidden;
            margin: 0 20px; /* Tiny margin for small screens */
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === 3. LEFT SIDE (BRANDING) === */
        .login-brand {
            flex: 1;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            position: relative;
        }

        .login-brand::before, .login-brand::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(7, 123, 204, 0.15);
            filter: blur(40px);
        }
        .login-brand::before { width: 200px; height: 200px; top: -50px; left: -50px; }
        .login-brand::after { width: 250px; height: 250px; bottom: -80px; right: -50px; }

        .login-brand h2 {
            font-size: 32px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 15px;
            position: relative; z-index: 1;
        }
        
        .login-brand p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            max-width: 85%;
            position: relative; z-index: 1;
        }

        /* === 4. RIGHT SIDE (FORM) === */
        .login-form-container {
            flex: 1;
            padding: 40px 50px; /* Reduced top/bottom padding */
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
        }

        .login-form-container h1 {
            font-size: 28px;
            color: #0f172a;
            margin-bottom: 6px;
            font-weight: 800;
        }
        
        .login-form-container .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px; /* Reduced margin */
        }

        /* === 5. STYLING DJANGO FORM === */
        .login-form-container form p {
            margin-bottom: 18px; /* Reduced spacing between inputs */
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .login-form-container label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .login-form-container input[type="text"],
        .login-form-container input[type="password"] {
            width: 100%;
            padding: 12px 16px 12px 42px; /* Slightly smaller padding */
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #0f172a;
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        .login-form-container input:focus {
            border-color: #077BCC;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(7, 123, 204, 0.1);
        }

        /* Icons inside inputs */
        .login-form-container form p:has(input[type="text"])::before {
            content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%2364748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>');
            position: absolute;
            top: 34px; /* Adjusted for smaller inputs */
            left: 15px;
            opacity: 0.7;
            pointer-events: none;
        }

        .login-form-container form p:has(input[type="password"])::before {
            content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%2364748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>');
            position: absolute;
            top: 34px;
            left: 15px;
            opacity: 0.7;
            pointer-events: none;
        }

        .login-form-container .helptext {
            display: none;
        }

        /* === 6. SUBMIT BUTTON === */
        .btn-login {
            width: 100%;
            background: linear-gradient(to right, #077BCC, #0560a1);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
            box-shadow: 0 4px 15px rgba(7, 123, 204, 0.3);
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(7, 123, 204, 0.4);
        }

        /* === 7. MOBILE RESPONSIVE === */
        @media (max-width: 850px) {
            .login-card {
                flex-direction: column;
                height: auto;
                max-height: none;
                overflow-y: auto; /* Allows scroll only on tiny mobile screens */
                margin: 20px;
            }
            body {
                overflow: auto; /* Allows scroll on mobile */
                height: auto;
                min-height: 100vh;
                padding: 20px 0;
            }
            .login-brand {
                padding: 30px 20px;
            }
            .login-form-container {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        
        <!-- LEFT SIDE: Branding -->
        <div class="login-brand">
            <h2>Employee Portal</h2>
            <p>Access your dashboard, view your payslips, and manage your payroll information securely.</p>
        </div>

        <!-- RIGHT SIDE: Login Form -->
        <div class="login-form-container">
            <h1>Welcome Back</h1>
            <p class="subtitle">Please enter your details to sign in.</p>
            
            <form method="post">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <button type="submit" class="btn-login">Sign In</button>
            </form>
        </div>

    </div>

</body>
</html>
